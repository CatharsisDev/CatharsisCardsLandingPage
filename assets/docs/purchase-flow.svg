<svg viewBox="0 0 640 1180" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Catharsis Cards purchase and fulfillment flow</title>
  <desc>Eight-step flow from a customer clicking Buy through Stripe checkout, webhook delivery to Google Apps Script, session verification, code claiming from a Google Sheet, and the fulfillment email.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/>
    </marker>
  </defs>
  <rect width="640" height="1180" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1B1B4D">Purchase &amp; Fulfillment Flow</text>
  <text x="320" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">One guide purchase, start to finish</text>

  <!-- Legend -->
  <g font-size="11" fill="#555">
    <rect x="70" y="70" width="12" height="12" rx="2" fill="#EAF1FB" stroke="#7CA6D9"/>
    <text x="88" y="80">Website</text>
    <rect x="170" y="70" width="12" height="12" rx="2" fill="#FDF0E3" stroke="#E0A458"/>
    <text x="188" y="80">Stripe</text>
    <rect x="255" y="70" width="12" height="12" rx="2" fill="#EAF7EE" stroke="#6FBE8C"/>
    <text x="273" y="80">Google (Apps Script / Sheet / Drive / Gmail)</text>
  </g>

  <!-- step template: box y, fill/stroke, title, sub -->
  <!-- Step 1 -->
  <g>
    <rect x="80" y="105" width="480" height="88" rx="10" fill="#EAF1FB" stroke="#7CA6D9" stroke-width="1.5"/>
    <text x="320" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1B3A5C">1. Customer clicks &quot;Buy for iOS/Android&quot;</text>
    <text x="320" y="153" text-anchor="middle" font-size="12" fill="#3A3A3A">Button opens a Stripe Payment Link (no checkout code on the site itself)</text>
    <text x="320" y="171" text-anchor="middle" font-size="11" fill="#7A7A7A">gtag fires a "pdf_purchase_click" event at the same time</text>
  </g>
  <line x1="320" y1="193" x2="320" y2="223" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g>
    <rect x="80" y="225" width="480" height="88" rx="10" fill="#FDF0E3" stroke="#E0A458" stroke-width="1.5"/>
    <text x="320" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#7A4A12">2. Stripe Checkout</text>
    <text x="320" y="273" text-anchor="middle" font-size="12" fill="#3A3A3A">Customer pays and enters their email; quantity is adjustable</text>
    <text x="320" y="291" text-anchor="middle" font-size="11" fill="#7A7A7A">Sandbox and live are separate Stripe accounts, not a mode toggle</text>
  </g>
  <line x1="320" y1="313" x2="320" y2="343" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g>
    <rect x="80" y="345" width="480" height="88" rx="10" fill="#FDF0E3" stroke="#E0A458" stroke-width="1.5"/>
    <text x="320" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#7A4A12">3. Stripe fires a webhook</text>
    <text x="320" y="393" text-anchor="middle" font-size="12" fill="#3A3A3A">checkout.session.completed &#8594; the Apps Script /exec URL</text>
    <text x="320" y="411" text-anchor="middle" font-size="11" fill="#7A7A7A">Both Stripe accounts point at the same URL, told apart by "livemode"</text>
  </g>
  <line x1="320" y1="433" x2="320" y2="463" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g>
    <rect x="80" y="465" width="480" height="88" rx="10" fill="#EAF7EE" stroke="#6FBE8C" stroke-width="1.5"/>
    <text x="320" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#1F5C36">4. Apps Script receives it (doPost)</text>
    <text x="320" y="513" text-anchor="middle" font-size="12" fill="#3A3A3A">Checks the ?token= URL parameter against SHARED_SECRET</text>
    <text x="320" y="531" text-anchor="middle" font-size="11" fill="#7A7A7A">Only the session ID from the webhook body is trusted at this point</text>
  </g>
  <line x1="320" y1="553" x2="320" y2="583" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <g>
    <rect x="80" y="585" width="480" height="88" rx="10" fill="#FDF0E3" stroke="#E0A458" stroke-width="1.5"/>
    <text x="320" y="612" text-anchor="middle" font-size="14" font-weight="700" fill="#7A4A12">5. Re-fetches the session from Stripe's API</text>
    <text x="320" y="633" text-anchor="middle" font-size="12" fill="#3A3A3A">Gets the authoritative amount paid, buyer email, and metadata</text>
    <text x="320" y="651" text-anchor="middle" font-size="11" fill="#7A7A7A">Fixes a real bug where the webhook body alone under-reported quantity</text>
  </g>
  <line x1="320" y1="673" x2="320" y2="703" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <g>
    <rect x="80" y="705" width="480" height="88" rx="10" fill="#EAF7EE" stroke="#6FBE8C" stroke-width="1.5"/>
    <text x="320" y="732" text-anchor="middle" font-size="14" font-weight="700" fill="#1F5C36">6. Idempotency check</text>
    <text x="320" y="753" text-anchor="middle" font-size="12" fill="#3A3A3A">Session ID looked up in the "ProcessedSessions" sheet tab</text>
    <text x="320" y="771" text-anchor="middle" font-size="11" fill="#7A7A7A">Already-seen sessions are skipped, so a redelivered webhook can't double-fulfill</text>
  </g>
  <line x1="320" y1="793" x2="320" y2="823" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 7 -->
  <g>
    <rect x="80" y="825" width="480" height="88" rx="10" fill="#EAF7EE" stroke="#6FBE8C" stroke-width="1.5"/>
    <text x="320" y="852" text-anchor="middle" font-size="14" font-weight="700" fill="#1F5C36">7. Claims code(s) from the Google Sheet</text>
    <text x="320" y="873" text-anchor="middle" font-size="12" fill="#3A3A3A">iOS or Android tab, one row per unit purchased, marked Used</text>
    <text x="320" y="891" text-anchor="middle" font-size="11" fill="#7A7A7A">If the tab is empty, the owner is emailed instead of the buyer getting nothing</text>
  </g>
  <line x1="320" y1="913" x2="320" y2="943" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 8 -->
  <g>
    <rect x="80" y="945" width="480" height="88" rx="10" fill="#EAF7EE" stroke="#6FBE8C" stroke-width="1.5"/>
    <text x="320" y="972" text-anchor="middle" font-size="14" font-weight="700" fill="#1F5C36">8. Emails the buyer</text>
    <text x="320" y="993" text-anchor="middle" font-size="12" fill="#3A3A3A">GmailApp sends the PDF (from Drive) + redemption code(s)</text>
    <text x="320" y="1011" text-anchor="middle" font-size="11" fill="#7A7A7A">Sent from the Google account the Apps Script project is deployed under</text>
  </g>

  <text x="320" y="1060" text-anchor="middle" font-size="12" fill="#8A8A8A">Total round trip: typically a few seconds after payment</text>
  <text x="320" y="1080" text-anchor="middle" font-size="11" fill="#8A8A8A">See section 8 of the handover document for the full explanation</text>
</svg>
