<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Catharsis Cards website page structure</title>
  <desc>The homepage links to three standalone guide landing pages. sitemap.xml lists all four pages and robots.txt points search engines at the sitemap.</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1B1B4D">Site Structure</text>

  <!-- Homepage -->
  <rect x="290" y="55" width="220" height="64" rx="10" fill="#EAF1FB" stroke="#7CA6D9" stroke-width="1.5"/>
  <text x="400" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1B3A5C">index.html</text>
  <text x="400" y="98" text-anchor="middle" font-size="11" fill="#3A3A3A">Homepage — hero, Circle, guides grid</text>

  <!-- 3 guide pages -->
  <line x1="400" y1="119" x2="130" y2="185" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="400" y1="119" x2="400" y2="185" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="400" y1="119" x2="670" y2="185" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="20" y="187" width="220" height="72" rx="10" fill="#EAF7EE" stroke="#6FBE8C" stroke-width="1.5"/>
  <text x="130" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F5C36">overthinking-reset.html</text>
  <text x="130" y="230" text-anchor="middle" font-size="11" fill="#3A3A3A">"The Overthinking Reset"</text>
  <text x="130" y="246" text-anchor="middle" font-size="10" fill="#7A7A7A">Own meta tags + Product JSON-LD</text>

  <rect x="290" y="187" width="220" height="72" rx="10" fill="#EAF7EE" stroke="#6FBE8C" stroke-width="1.5"/>
  <text x="400" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F5C36">boundaries-reset.html</text>
  <text x="400" y="230" text-anchor="middle" font-size="11" fill="#3A3A3A">"The Boundaries Reset"</text>
  <text x="400" y="246" text-anchor="middle" font-size="10" fill="#7A7A7A">Own meta tags + Product JSON-LD</text>

  <rect x="560" y="187" width="220" height="72" rx="10" fill="#EAF7EE" stroke="#6FBE8C" stroke-width="1.5"/>
  <text x="670" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F5C36">emotional-burnout-reset.html</text>
  <text x="670" y="230" text-anchor="middle" font-size="11" fill="#3A3A3A">"The Emotional Burnout Reset"</text>
  <text x="670" y="246" text-anchor="middle" font-size="10" fill="#7A7A7A">Own meta tags + Product JSON-LD</text>

  <!-- sitemap / robots -->
  <line x1="130" y1="259" x2="290" y2="330" stroke="#C9C2AE" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="400" y1="259" x2="330" y2="330" stroke="#C9C2AE" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="670" y1="259" x2="420" y2="330" stroke="#C9C2AE" stroke-width="1.3" stroke-dasharray="4 3"/>

  <rect x="230" y="332" width="220" height="60" rx="10" fill="#FDF0E3" stroke="#E0A458" stroke-width="1.5"/>
  <text x="340" y="356" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7A4A12">sitemap.xml</text>
  <text x="340" y="374" text-anchor="middle" font-size="10.5" fill="#3A3A3A">Lists all 4 pages for Google</text>

  <line x1="450" y1="362" x2="560" y2="362" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="560" y="332" width="200" height="60" rx="10" fill="#FDF0E3" stroke="#E0A458" stroke-width="1.5"/>
  <text x="660" y="356" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7A4A12">robots.txt</text>
  <text x="660" y="374" text-anchor="middle" font-size="10.5" fill="#3A3A3A">Points crawlers at the sitemap</text>
</svg>
